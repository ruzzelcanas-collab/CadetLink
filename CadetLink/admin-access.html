<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1e40af" />
  <link rel="icon" href="icons/cadetlink.svg" type="image/svg+xml" />
  <title>CadetLink - Admin access</title>
  <link rel="stylesheet" href="Access.css" />
  <link rel="stylesheet" href="responsive.css" />
  <script src="auth-utils.js"></script>
</head>
<body class="access-page">
  <main class="access-shell">
    <section class="access-card" aria-labelledby="adminAccessTitle">
      <p class="screen-eyebrow">PRIVATE ADMIN ACCESS</p>
      <h1 id="adminAccessTitle">Admin sign-in</h1>
      <p class="access-intro">Sign in with the name and password for your manually provisioned Admin account.</p>

      <form id="adminSignInForm">
        <div class="form-group">
          <label for="adminSignInName">Admin name</label>
          <input id="adminSignInName" type="text" autocomplete="username" maxlength="100" required />
        </div>
        <div class="form-group">
          <label for="adminSignInPassword">Password</label>
          <input id="adminSignInPassword" type="password" autocomplete="current-password" maxlength="200" required />
        </div>
        <p class="form-error" id="adminSignInError" role="alert"></p>
        <button class="button-primary access-submit" type="submit">Sign in as Admin</button>
      </form>

      <p class="access-status" id="adminAccessStatus" role="status" aria-live="polite"></p>
      <a class="admin-access-link" href="index.html">Back to regular sign-in</a>
    </section>
  </main>
  <script src="AdminAccess.js"></script>
</body>
</html>
